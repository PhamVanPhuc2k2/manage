upstream api_upstream {
    # Docker DNS trả về một bản ghi A cho mỗi container api, và nginx tạo một
    # peer cho từng bản ghi rồi luân phiên gửi — đo thật với ba bản cho ra
    # đúng 10/10/10 trên ba mươi request.
    #
    # NHƯNG việc phân giải đó chỉ xảy ra ĐÚNG MỘT LẦN, lúc nạp cấu hình.
    # nginx bản mã nguồn mở không tra lại DNS cho `server` trong upstream (tham
    # số `resolve` là tính năng của nginx Plus). Hệ quả:
    #
    #   - Scale thêm bản api SAU khi nginx đã chạy → bản mới không nhận được
    #     một request nào.
    #   - Thay container khi triển khai → nginx trỏ tới IP cũ đã chết.
    #
    # Vì vậy scripts/deploy.sh gọi `nginx -s reload` sau khi thay xong api, và
    # sau mọi lần `--scale` cũng phải nạp lại. Đừng bỏ hai bước đó: hỏng theo
    # kiểu này không báo lỗi cấu hình nào cả, chỉ là lưu lượng đi sai chỗ.
    #
    # (Một lựa chọn khác là `resolver 127.0.0.11` kèm proxy_pass vào biến để
    # tra DNS mỗi lần, nhưng khi đó mất khối upstream và mất luôn keepalive —
    # đổi một lần nạp lại lúc triển khai lấy một kết nối TCP mới cho MỌI request
    # là không đáng.)
    server api:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Header bảo mật ---
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Content-Security-Policy.
    #
    # 'unsafe-inline' cho style là nhượng bộ với Tailwind và Next.js: cả hai
    # chèn style nội tuyến lúc chạy. Script thì KHÔNG có 'unsafe-inline' —
    # đó mới là lớp phòng thủ thật chống XSS, và Next.js ở chế độ production
    # không cần nó.
    #
    # connect-src phải có cả ws: và wss: — thiếu chúng thì trình duyệt chặn
    # kết nối WebSocket và toàn bộ chat cùng chấm công ngừng hoạt động mà
    # console chỉ báo một dòng lỗi CSP khó truy.
    #
    # Viết trên MỘT dòng dù dài. nginx không có cú pháp nối dòng bằng dấu gạch
    # chéo ngược: ký tự đó sẽ đi thẳng vào giá trị header. Còn chuỗi trong
    # ngoặc kép trải nhiều dòng thì nhúng ký tự xuống dòng vào header HTTP —
    # vừa sai chuẩn vừa là chỗ để chèn header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Health check của chính nginx, không chuyển tiếp đi đâu.
    location = /health {
        access_log off;
        # default_type chứ không phải add_header: `return` bỏ qua Content-Type
        # đặt bằng add_header, client sẽ nhận application/octet-stream.
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- /metrics: CHỈ cho mạng nội bộ ---
    #
    # Chỉ số Prometheus không cần xác thực ở tầng ứng dụng, nên hàng rào duy
    # nhất là ở đây. Mở nó ra internet là để lộ cấu trúc hệ thống, tên route,
    # số nhân viên đang online và thông tin build — vừa là trinh sát miễn phí
    # cho kẻ tấn công, vừa là một endpoint tốn CPU để nhắm vào.
    #
    # Dải địa chỉ dưới đây là mạng riêng RFC 1918, phủ cả mạng bridge mặc định
    # của Docker (172.16.0.0/12). Prometheus chạy trong cùng compose nên nó
    # luôn gọi từ một trong các dải này.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        access_log off;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    # --- REST API ---
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Đăng nhập: giới hạn chặt hơn phần API còn lại ---
    #
    # Gồm cả hai endpoint của bước hai. Bỏ verify-otp ra ngoài là để hở đúng
    # chỗ cần chặn nhất: mã chỉ có 6 chữ số, không giới hạn tốc độ thì kẻ
    # tấn công bắn song song hàng nghìn request và bộ đếm 5 lần của một thử
    # thách không cứu được gì — chúng chỉ việc mở thử thách mới.
    location ~ ^/api/v1/auth/(login|verify-otp|resend-otp)$ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =======================================================================
    # WEBSOCKET — phần dễ sai nhất trong toàn bộ cấu hình nginx.
    #
    # Thiếu proxy_read_timeout dài, nginx đóng kết nối sau 60 giây mặc định.
    # Với dự án này, đó cũng là lúc dữ liệu chấm công bắt đầu sai.
    # Cấu hình sẵn từ Phase 0 dù Phase 5 mới dùng tới.
    # =======================================================================
    location /ws {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối tối đa 1 giờ không có dữ liệu.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Tắt buffer: tin nhắn phải đẩy tới client ngay, không gom lại.
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Asset tĩnh của Next.js: cache lâu vì tên file có hash ---
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Mọi thứ còn lại về frontend ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev dùng WebSocket cho hot reload — cần hai dòng này.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
