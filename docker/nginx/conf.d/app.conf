upstream api_upstream {
    # Docker DNS tự phân giải ra nhiều IP khi scale, nginx luân phiên gửi.
    server api:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Header bảo mật ---
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Health check của chính nginx, không chuyển tiếp đi đâu.
    location = /health {
        access_log off;
        # default_type chứ không phải add_header: `return` bỏ qua Content-Type
        # đặt bằng add_header, client sẽ nhận application/octet-stream.
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- REST API ---
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Đăng nhập: giới hạn chặt hơn phần API còn lại ---
    #
    # Gồm cả hai endpoint của bước hai. Bỏ verify-otp ra ngoài là để hở đúng
    # chỗ cần chặn nhất: mã chỉ có 6 chữ số, không giới hạn tốc độ thì kẻ
    # tấn công bắn song song hàng nghìn request và bộ đếm 5 lần của một thử
    # thách không cứu được gì — chúng chỉ việc mở thử thách mới.
    location ~ ^/api/v1/auth/(login|verify-otp|resend-otp)$ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =======================================================================
    # WEBSOCKET — phần dễ sai nhất trong toàn bộ cấu hình nginx.
    #
    # Thiếu proxy_read_timeout dài, nginx đóng kết nối sau 60 giây mặc định.
    # Với dự án này, đó cũng là lúc dữ liệu chấm công bắt đầu sai.
    # Cấu hình sẵn từ Phase 0 dù Phase 5 mới dùng tới.
    # =======================================================================
    location /ws {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối tối đa 1 giờ không có dữ liệu.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Tắt buffer: tin nhắn phải đẩy tới client ngay, không gom lại.
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Asset tĩnh của Next.js: cache lâu vì tên file có hash ---
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Mọi thứ còn lại về frontend ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev dùng WebSocket cho hot reload — cần hai dòng này.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
