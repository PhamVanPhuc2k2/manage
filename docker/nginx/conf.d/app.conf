upstream api_upstream {
    # Docker DNS trả về một bản ghi A cho mỗi container api, và nginx tạo một
    # peer cho từng bản ghi rồi luân phiên gửi — đo thật với ba bản cho ra
    # đúng 10/10/10 trên ba mươi request.
    #
    # NHƯNG việc phân giải đó chỉ xảy ra ĐÚNG MỘT LẦN, lúc nạp cấu hình.
    # nginx bản mã nguồn mở không tra lại DNS cho `server` trong upstream (tham
    # số `resolve` là tính năng của nginx Plus). Hệ quả:
    #
    #   - Scale thêm bản api SAU khi nginx đã chạy → bản mới không nhận được
    #     một request nào.
    #   - Thay container khi triển khai → nginx trỏ tới IP cũ đã chết.
    #
    # Vì vậy scripts/deploy.sh gọi `nginx -s reload` sau khi thay xong api, và
    # sau mọi lần `--scale` cũng phải nạp lại. Đừng bỏ hai bước đó: hỏng theo
    # kiểu này không báo lỗi cấu hình nào cả, chỉ là lưu lượng đi sai chỗ.
    #
    # (Một lựa chọn khác là `resolver 127.0.0.11` kèm proxy_pass vào biến để
    # tra DNS mỗi lần, nhưng khi đó mất khối upstream và mất luôn keepalive —
    # đổi một lần nạp lại lúc triển khai lấy một kết nối TCP mới cho MỌI request
    # là không đáng.)
    server api:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Header bảo mật ---
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Content-Security-Policy KHÔNG đặt ở đây nữa — xem frontend/src/middleware.ts.
    #
    # Cấu hình cũ đặt `script-src 'self'` với lập luận rằng Next.js ở chế độ
    # production không cần 'unsafe-inline'. Lập luận đó SAI: Next.js luôn nhúng
    # vài đoạn script nội tuyến để khởi động và để truyền dữ liệu streaming.
    # Trình duyệt chặn chúng, React không hydrate, và MỌI trang thành HTML tĩnh:
    # bấm nút không có gì xảy ra, không ai đăng nhập được.
    #
    # Triệu chứng rất khó lần: trang vẫn hiện đầy đủ và đúng bố cục, nginx và
    # api vẫn trả 200, không có dòng lỗi nào trong log. Chỉ console của trình
    # duyệt mới nói ra sự thật.
    #
    # Cách đúng là nonce: mỗi request một giá trị ngẫu nhiên, chỉ script mang
    # đúng nonce được chạy. Nonce phải sinh ở nơi biết từng request, tức là trong
    # ứng dụng chứ không phải trong một tệp cấu hình tĩnh.
    #
    # Đặt thêm một CSP ở đây không làm chặt hơn mà chỉ gây xung đột: khi có
    # hai header CSP, trình duyệt áp phần GIAO của cả hai, nên cái chặt hơn
    # thắng và nonce trở nên vô dụng.

    # Health check của chính nginx, không chuyển tiếp đi đâu.
    location = /health {
        access_log off;
        # default_type chứ không phải add_header: `return` bỏ qua Content-Type
        # đặt bằng add_header, client sẽ nhận application/octet-stream.
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- /metrics: CHỈ cho mạng nội bộ ---
    #
    # Chỉ số Prometheus không cần xác thực ở tầng ứng dụng, nên hàng rào duy
    # nhất là ở đây. Mở nó ra internet là để lộ cấu trúc hệ thống, tên route,
    # số nhân viên đang online và thông tin build — vừa là trinh sát miễn phí
    # cho kẻ tấn công, vừa là một endpoint tốn CPU để nhắm vào.
    #
    # Dải địa chỉ dưới đây là mạng riêng RFC 1918, phủ cả mạng bridge mặc định
    # của Docker (172.16.0.0/12). Prometheus chạy trong cùng compose nên nó
    # luôn gọi từ một trong các dải này.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        access_log off;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    # --- /ready: CHỈ cho mạng nội bộ ---
    #
    # `/health` ở trên là sức khoẻ của CHÍNH NGINX — nó trả 200 ngay cả khi
    # api đã chết. `/ready` mới là câu trả lời cho "hệ thống dùng được chưa":
    # nó hỏi api, và api hỏi tiếp PostgreSQL, Redis, RabbitMQ.
    #
    # Thiếu khối này thì `/ready` rơi xuống `location /` và đi sang frontend,
    # nên Next.js trả 404. Cả scripts/deploy.sh lẫn scripts/restore.sh đều
    # kiểm đường này sau khi chạy xong, và cả hai đều báo thất bại trong khi
    # hệ thống hoàn toàn bình thường.
    #
    # Giới hạn ở mạng riêng giống /metrics: phản hồi liệt kê từng thành phần hạ
    # tầng kèm trạng thái, tức là vẽ sẵn sơ đồ hệ thống cho người ngoài và
    # chỉ đúng thứ đang yếu để nhắm vào. Script triển khai chạy trên chính
    # máy chủ nên luôn đi từ một trong các dải này.
    location = /ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        access_log off;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        # Ngắn hơn /api nhiều: đây là câu hỏi "còn sống không", và một lần
        # chờ 60 giây ở đây làm kịch bản triển khai đứng im thay vì báo hỏng.
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # --- REST API ---
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Đăng nhập: giới hạn chặt hơn phần API còn lại ---
    #
    # Gồm cả hai endpoint của bước hai. Bỏ verify-otp ra ngoài là để hở đúng
    # chỗ cần chặn nhất: mã chỉ có 6 chữ số, không giới hạn tốc độ thì kẻ
    # tấn công bắn song song hàng nghìn request và bộ đếm 5 lần của một thử
    # thách không cứu được gì — chúng chỉ việc mở thử thách mới.
    location ~ ^/api/v1/auth/(login|verify-otp|resend-otp)$ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =======================================================================
    # WEBSOCKET — phần dễ sai nhất trong toàn bộ cấu hình nginx.
    #
    # Thiếu proxy_read_timeout dài, nginx đóng kết nối sau 60 giây mặc định.
    # Với dự án này, đó cũng là lúc dữ liệu chấm công bắt đầu sai.
    # Cấu hình sẵn từ Phase 0 dù Phase 5 mới dùng tới.
    # =======================================================================
    location /ws {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối tối đa 1 giờ không có dữ liệu.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Tắt buffer: tin nhắn phải đẩy tới client ngay, không gom lại.
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Asset tĩnh của Next.js: cache lâu vì tên file có hash ---
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Mọi thứ còn lại về frontend ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev dùng WebSocket cho hot reload — cần hai dòng này.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
