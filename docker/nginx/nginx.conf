user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ghi kèm request_id để nối log nginx với log của api và worker.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'rid=$http_x_request_id';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 25m;   # khớp với giới hạn upload tệp đính kèm

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Map này cần cho WebSocket: chuyển giá trị header Upgrade thành
    # "upgrade" hoặc "close" tuỳ request. Thiếu nó thì WS không hoạt động.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Giới hạn đăng nhập ở tầng nginx CHỈ để chặn tấn công tự động quy mô lớn.
    #
    # Đặt 5r/m như ban đầu là sai: cả văn phòng đi chung một IP công cộng, nên
    # 5 lượt đăng nhập mỗi phút là giới hạn cho TOÀN CÔNG TY — sáng thứ hai
    # mọi người vào làm cùng lúc là tắc. Việc chặn dò mật khẩu chính xác theo
    # từng tài khoản do tầng ứng dụng lo (xem pkg LoginThrottle), nơi biết ai
    # đang đăng nhập chứ không chỉ biết địa chỉ IP.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    # Mặc định nginx trả 503 khi vượt giới hạn — sai ngữ nghĩa và làm client
    # tưởng máy chủ hỏng. 429 mới là mã dành cho "gửi quá nhiều request".
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
