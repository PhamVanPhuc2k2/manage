apiVersion: 1

providers:
  - name: manage
    orgId: 1
    folder: Manage
    type: file
    # Cho phép xoá trên giao diện thì dashboard sẽ biến mất khỏi Grafana mà
    # vẫn còn trong git — lần khởi động sau nó lại xuất hiện, và không ai hiểu
    # vì sao.
    disableDeletion: true
    # Cho Grafana nạp lại khi file đổi, để sửa dashboard trong git là thấy
    # ngay mà không phải khởi động lại container.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
