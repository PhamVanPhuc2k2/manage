# Cấu hình Prometheus.
#
# Scrape trực tiếp TÊN SERVICE của Docker, không qua nginx: nginx chỉ chặn
# /metrics từ bên ngoài, còn trong mạng nội bộ thì gọi thẳng vừa ngắn hơn
# vừa không phụ thuộc nginx còn sống.
#
# Với api chạy nhiều replica, `api:8080` phân giải ra NHIỀU địa chỉ IP.
# dns_sd_configs bên dưới lấy hết chúng — dùng static_configs sẽ chỉ scrape
# đúng một replica do Docker DNS trả về đầu tiên, và số kết nối WebSocket báo
# về sẽ là của một instance chứ không phải của cả hệ thống.
#
# Không cần relabel_configs để đặt nhãn instance: Prometheus tự lấy nó từ
# __address__, nên mỗi replica đã có nhãn riêng là địa chỉ IP của nó.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

# Chưa cấu hình Alertmanager: quy tắc trong alerts.yml vẫn được TÍNH và hiện
# trong Prometheus UI cùng Grafana, chỉ là không tự gửi đi đâu. Bỏ trống khối
# này thay vì khai báo một danh sách rỗng — Prometheus chấp nhận cả hai, nhưng
# một khối rỗng trông như đã cấu hình xong.
#
# Khi có kênh nhận (email, Slack, Telegram), thêm:
#
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # --- api: nhiều replica ---
  - job_name: manage-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080

  # --- worker: nhiều replica ---
  - job_name: manage-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8080

  # --- Hạ tầng ---
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  # RabbitMQ có plugin prometheus sẵn trong image -management, cổng 15692.
  # Nó cho biết những thứ chỉ broker biết: số connection, số channel, tốc độ
  # publish/deliver — bổ sung cho chỉ số độ sâu hàng đợi mà worker tự đo.
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  # LiveKit tự phục vụ /metrics trên một cổng RIÊNG (prometheus_port trong
  # docker/livekit/livekit.yaml), không phải cổng 7880 của signaling.
  #
  # Đây là nguồn duy nhất trả lời được ba câu quyết định chi phí: bao nhiêu
  # phòng đang mở, bao nhiêu người trong đó, và băng thông đang ra vào bao
  # nhiêu. Không scrape thì hoá đơn băng thông là thứ đầu tiên báo cho bạn
  # biết có chuyện.
  - job_name: livekit
    static_configs:
      - targets: [livekit:6789]
