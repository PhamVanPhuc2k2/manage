# Chạy bằng:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Lưu ý: khi chỉ định -f, Compose KHÔNG tự nạp docker-compose.override.yml,
# nên mọi thiết lập dev ở file đó bị loại bỏ hoàn toàn.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-prod-common: &prod-common
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    <<: *prod-common
    # Không mở port ra host. Muốn truy cập thì SSH vào server rồi docker exec.
    ports: []
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }

  redis:
    <<: *prod-common
    ports: []
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  rabbitmq:
    <<: *prod-common
    ports: []
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  minio:
    <<: *prod-common
    ports: []

  api:
    <<: *prod-common
    # Không build tại chỗ — kéo image đã build và quét bảo mật trong CI.
    build: !reset null
    image: ghcr.io/yourorg/manage-api:${IMAGE_TAG:-latest}
    volumes: []
    ports: []
    read_only: true          # container không ghi được vào filesystem
    tmpfs: [/tmp]            # trừ /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      ENV: production
      LOG_LEVEL: info
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    <<: *prod-common
    build: !reset null
    image: ghcr.io/yourorg/manage-worker:${IMAGE_TAG:-latest}
    volumes: []
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      ENV: production
      LOG_LEVEL: info
      WORKER_CONCURRENCY: 10
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    <<: *prod-common
    build: !reset null
    image: ghcr.io/yourorg/manage-frontend:${IMAGE_TAG:-latest}
    volumes: []
    ports: []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/ws

  nginx:
    <<: *prod-common
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
