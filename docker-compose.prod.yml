# Chạy bằng:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Lưu ý: khi chỉ định -f, Compose KHÔNG tự nạp docker-compose.override.yml,
# nên mọi thiết lập dev ở file đó bị loại bỏ hoàn toàn.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-prod-common: &prod-common
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    <<: *prod-common
    # Không mở port ra host. Muốn truy cập thì SSH vào server rồi docker exec.
    ports: []
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }

  redis:
    <<: *prod-common
    ports: []
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  rabbitmq:
    <<: *prod-common
    ports: []
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  api:
    <<: *prod-common
    # Không build tại chỗ — kéo image đã build và quét bảo mật trong CI.
    build: !reset null
    image: ghcr.io/PhamVanPhuc2k2/manage-api:${IMAGE_TAG:-latest}
    volumes: []
    ports: []
    read_only: true          # container không ghi được vào filesystem
    tmpfs: [/tmp]            # trừ /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      ENV: production
      LOG_LEVEL: info
    # 60 giây để đóng sạch kết nối WebSocket khi triển khai.
    #
    # Khai báo LẠI ở đây dù docker-compose.yml đã có: file prod hay được đọc
    # một mình khi cần biết production đang chạy thế nào, và một giá trị quan
    # trọng như thế này không nên phải đi tìm ở file khác.
    stop_grace_period: 60s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    <<: *prod-common
    build: !reset null
    image: ghcr.io/PhamVanPhuc2k2/manage-worker:${IMAGE_TAG:-latest}
    volumes: []
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      ENV: production
      LOG_LEVEL: info
      WORKER_CONCURRENCY: 10
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    <<: *prod-common
    build: !reset null
    image: ghcr.io/PhamVanPhuc2k2/manage-frontend:${IMAGE_TAG:-latest}
    volumes: []
    ports: []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/ws

  nginx:
    <<: *prod-common
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      # Thư mục xác thực của Let's Encrypt. certbot ghi vào, nginx phục vụ ra.
      - ./docker/nginx/acme:/var/www/certbot:ro
    # Tự nạp lại cấu hình mỗi 6 giờ để dùng chứng chỉ vừa gia hạn.
    #
    # Việc nạp lại phải do CHÍNH nginx làm. Cách hay thấy là để certbot gọi
    # `docker kill -s HUP` sang container nginx, nhưng image certbot không có
    # Docker CLI và không có socket Docker — lệnh đó luôn thất bại trong im
    # lặng, và chứng chỉ mới nằm trên đĩa trong khi nginx vẫn phục vụ bản cũ
    # cho tới một lần khởi động lại tình cờ nào đó. Nó hết hạn giữa lúc đó.
    #
    # `nginx -s reload` không làm rơi kết nối nào: tiến trình cũ phục vụ nốt
    # rồi mới thoát.
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          sleep 6h & wait $${!}
          nginx -s reload
        done &
        nginx -g 'daemon off;'

  # =======================================================================
  # TLS — Let's Encrypt, tự gia hạn
  #
  # certbot ở chế độ webroot chứ không standalone: standalone cần chiếm cổng
  # 80, mà cổng đó nginx đang giữ. Webroot thì certbot chỉ ghi một file vào
  # thư mục dùng chung và nginx phục vụ file đó — không ai phải dừng.
  #
  # Vòng lặp 12 giờ: Let's Encrypt chỉ gia hạn khi chứng chỉ còn dưới 30 ngày,
  # nên gọi renew thường xuyên là vô hại và không tính vào giới hạn tốc độ.
  # Hai lần một ngày là khuyến nghị của chính Let's Encrypt — nó bảo đảm gia
  # hạn vẫn xảy ra dù máy chủ có tắt vài ngày.
  #
  # Container này chỉ GIA HẠN. Lần cấp chứng chỉ ĐẦU TIÊN phải chạy tay một
  # lần, xem doc/OPERATIONS.md — nó cần domain đã trỏ DNS về máy chủ, và đó
  # là việc không tự động hoá được.
  # =======================================================================
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/acme:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet --no-random-sleep-on-renew
          sleep 12h
        done

  # =======================================================================
  # SAO LƯU theo lịch
  #
  # Chạy trong container riêng chứ không bằng cron của host: nó đi cùng
  # compose, dựng lại được trên máy mới, và cấu hình nằm trong git. Cron của
  # host là thứ không ai nhớ đã đặt gì cho tới khi chuyển máy chủ.
  # =======================================================================
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          STAMP=$$(date +%Y%m%d-%H%M%S)
          FILE=/backups/manage-$$STAMP.dump

          echo "[backup] bat dau $$STAMP"
          if pg_dump -h postgres -U ${POSTGRES_USER:-manage}                -d ${POSTGRES_DB:-manage} -Fc --no-owner --no-acl > "$$FILE"; then

            # Kiem tra doc duoc NGAY sau khi tao.
            #
            # pg_dump co the thoat voi ma 0 ma van cho file hong neu ket noi
            # dut giua chung. Mot ban backup hong con te hon khong co backup:
            # no tao cam giac an toan sai.
            if pg_restore --list "$$FILE" > /dev/null 2>&1; then
              echo "[backup] xong: $$FILE ($$(du -h $$FILE | cut -f1))"
            else
              echo "[backup] LOI: ban backup khong doc duoc, da xoa"
              rm -f "$$FILE"
            fi
          else
            echo "[backup] LOI: pg_dump that bai"
          fi

          find /backups -name 'manage-*.dump' -mtime +${BACKUP_KEEP_DAYS:-30} -delete
          sleep 24h
        done
