name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.27"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s --health-timeout 10s --health-retries 5
        ports: ["5672:5672"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Kiểm tra go.mod đã tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: backend

      - name: Chạy migration
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz \
            | tar xvz migrate
          ./migrate -path backend/migrations \
            -database "postgres://test:test@localhost:5432/test?sslmode=disable" up

      - name: Test
        working-directory: backend
        env:
          POSTGRES_DSN: postgres://test:test@localhost:5432/test?sslmode=disable
          REDIS_ADDR: localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Báo cáo coverage
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm lint
      - working-directory: frontend
        run: pnpm build

  # ==========================================================================
  # integration — repository trên PostgreSQL THẬT (testcontainers)
  # ==========================================================================
  #
  # Tách khỏi job `backend` vì hai bộ có nhu cầu ngược nhau: unit test phải
  # xong trong vài giây để chạy ở mọi commit, còn bộ này phải kéo image và
  # dựng container. Trộn vào nhau thì bộ nhanh mất tính nhanh.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # Không khai `services:` ở đây: testcontainers tự dựng container từ trong
      # mã kiểm thử, và runner của GitHub đã có sẵn Docker.
      - name: Integration test
        working-directory: backend
        run: go test -tags=integration -count=1 ./internal/repository/...

  # ==========================================================================
  # e2e — cả 6 bộ smoke trên stack Docker đầy đủ
  # ==========================================================================
  #
  # Đây là bộ duy nhất chạm vào MỌI thành phần cùng lúc: nginx, api, worker,
  # PostgreSQL, Redis, RabbitMQ và MailHog. Những lỗi nó bắt được — định
  # tuyến sai, thiếu biến môi trường, job không tới worker, mail không ra —
  # không có bộ nào khác trong pipeline này nhìn thấy.
  #
  # Toàn bộ việc nằm trong scripts/ci-e2e.sh chứ không viết thành các bước
  # YAML ở đây. Các bước trong YAML chỉ chạy được trên runner, nên mỗi lần
  # sửa là một lần đẩy commit lên rồi chờ xem CI đỏ hay xanh. Gói vào script
  # thì người phát triển chạy được y hệt ở máy mình trước khi mở pull request.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Dựng cả stack, seed, rồi chạy 286 phép kiểm. Trần thời gian để một lần
    # treo không chiếm runner hàng tiếng.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dựng stack, seed và chạy 6 bộ smoke
        run: bash scripts/ci-e2e.sh

      # Script tự dọn qua trap EXIT. Bước này là lưới chắn cho trường hợp
      # job bị hủy giữa chừng, khi đó trap không chạy.
      - name: Dọn
        if: always()
        run: docker compose down -v || true

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,      context: ./backend,  dockerfile: docker/backend/Dockerfile,  binary: api }
          - { name: worker,   context: ./backend,  dockerfile: docker/backend/Dockerfile,  binary: worker }
          - { name: frontend, context: ./frontend, dockerfile: docker/frontend/Dockerfile, binary: "" }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          # Chỉ đẩy lên registry khi vào main. PR chỉ build để kiểm tra.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/manage-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/manage-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          load: ${{ github.ref != 'refs/heads/main' }}

      # Ghim theo TAG, không dùng @master: @master là ref trôi nổi, đổi bất kỳ
      # lúc nào và có thể làm hỏng CI mà không ai chạm vào repo này. Với một
      # action chạy trong pipeline build thì đó cũng là rủi ro chuỗi cung ứng.
      - name: Quét lỗ hổng bảo mật
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/manage-${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
