name: manage

# ---------------------------------------------------------------------------
# Khối YAML dùng lại. api và worker có cùng cách build và cùng biến môi trường.
# ---------------------------------------------------------------------------
x-go-build: &go-build
  context: ./backend
  dockerfile: ../docker/backend/Dockerfile

x-go-env: &go-env
  ENV: ${ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
  AUTH_OTP_ENABLED: ${AUTH_OTP_ENABLED:-true}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  LIVEKIT_URL: http://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
  TURN_URLS: ${TURN_URLS:-}
  TURN_SECRET: ${TURN_SECRET:-}
  TZ: Asia/Ho_Chi_Minh

services:
  # =========================================================================
  # HẠ TẦNG
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Bật checksum để phát hiện hỏng dữ liệu sớm.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Script trong thư mục này CHỈ chạy lần đầu, khi volume còn rỗng.
      # Sửa script rồi muốn chạy lại thì phải xoá volume (make destroy).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      # RabbitMQ khởi động chậm, 60s là con số thực tế chứ không thừa.
      start_period: 60s
    networks: [backend]

  # =========================================================================
  # MIGRATION — chạy một lần rồi thoát, TRƯỚC khi api và worker khởi động.
  #
  # Tách riêng để khi scale api lên nhiều replica, migration không chạy
  # đồng thời nhiều lần gây xung đột khoá.
  # =========================================================================
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  # =========================================================================
  # ỨNG DỤNG
  # =========================================================================
  api:
    build:
      <<: *go-build
      target: dev
      args:
        BINARY: api
    restart: unless-stopped
    environment:
      <<: *go-env
      APP_NAME: api
      HTTP_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL},http://localhost:${FRONTEND_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    # Dài vì api giữ kết nối WebSocket cần đóng sạch khi triển khai.
    stop_grace_period: 60s
    networks: [backend, proxy]

  worker:
    build:
      <<: *go-build
      target: dev
      args:
        BINARY: worker
    restart: unless-stopped
    environment:
      <<: *go-env
      APP_NAME: worker
      WORKER_CONCURRENCY: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Từ Phase 6 worker có một máy chủ HTTP nhỏ chỉ để phục vụ /metrics và
    # /health. Kiểm tra qua HTTP thay vì pgrep là một phép thử MẠNH HƠN: nó
    # chứng minh tiến trình còn PHẢN HỒI, không chỉ còn tồn tại. Một worker
    # treo vì deadlock vẫn qua được pgrep.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Đủ dài để xử lý nốt job đang cầm.
    stop_grace_period: 120s
    networks: [backend]

  # =========================================================================
  # MÁY CHỦ MEDIA — SFU cho gọi nhóm, kèm TURN cho đường dự phòng.
  #
  # Media KHÔNG đi qua nginx. nginx là proxy HTTP; đẩy âm thanh và hình
  # ảnh thời gian thực qua nó là thêm một chặng buffer vào đường mà mọi
  # mili giây đều nghe thấy. Trình duyệt nối thẳng vào các cổng dưới đây.
  # =========================================================================
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped

    # Ghép bí mật vào tệp cấu hình LÚC KHỞI ĐỘNG, rồi mới chạy LiveKit.
    #
    # Bản trước truyền khoá bằng biến LIVEKIT_KEYS và nó chạy đúng — cho
    # tới khi bật webhook. LiveKit kiểm `webhook.api_key` có nằm trong danh
    # sách khoá của CHÍNH TỆP CẤU HÌNH hay không, không nhìn tới khoá đến từ
    # biến môi trường, và từ chối khởi động với đúng một dòng:
    # "api_key is required to use webhooks".
    #
    # Vì vậy bí mật phải vào cùng tệp — nhưng KHÔNG phải tệp trong kho mã.
    # Chép sang /tmp rồi nối thêm dòng khoá: tệp được mount vẫn chỉ đọc và
    # vẫn sạch bí mật.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp /etc/livekit.yaml /tmp/livekit.yaml
        {
          echo ""
          echo "keys:"
          echo "  $$LIVEKIT_API_KEY: $$LIVEKIT_API_SECRET"
        } >> /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signaling WebSocket — trình duyệt nối trực tiếp.
      - "${LIVEKIT_PORT:-7880}:7880"
      # RTC qua TCP, cho mạng chặn UDP.
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      # MỘT cổng UDP duy nhất cho toàn bộ media (UDP mux). Xem lý do
      # trong docker/livekit/livekit.yaml — map dải rộng là treo máy.
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
      # TURN tích hợp.
      - "${TURN_UDP_PORT:-3478}:3478/udp"
    healthcheck:
      # LiveKit trả "OK" ở gốc khi đã sẵn sàng nhận phiên.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          # SFU ăn CPU theo số luồng phải chuyển tiếp, khác hẳn api vốn
          # chỉ đợi I/O. Giới hạn để một cuộc họp đông người không
          # làm chết cả máy chủ kéo theo toàn bộ hệ thống.
          cpus: "2.0"
          memory: 1g
    networks: [backend, proxy]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}/api/v1
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}/ws
    depends_on:
      api:
        condition: service_healthy
    networks: [proxy]

  # =========================================================================
  # CỔNG VÀO — container DUY NHẤT mở port ra host ở production
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Dùng 127.0.0.1 chứ KHÔNG dùng localhost: `listen 80` của nginx chỉ bind
      # IPv4, trong khi localhost trong container phân giải ra ::1 trước —
      # healthcheck sẽ luôn báo "connection refused".
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [proxy]

networks:
  # Mạng nội bộ: database, cache, message broker, worker.
  backend:
    driver: bridge
  # Mạng biên: nginx, api, frontend.
  proxy:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
